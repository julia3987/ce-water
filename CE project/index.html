<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>River Basin Dashboard</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Your CSS -->
  <link rel="stylesheet" href="design.css" />
</head>

<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">River Basin Dashboard</div>

    <div class="nav">
      <button class="tabBtn active" id="btnIrrawaddy" type="button">Irrawaddy</button>
      <button class="tabBtn" id="btnMekong" type="button">Mekong</button>
    </div>

    <div class="rightNote" id="basinLabel">Irrawaddy Basin</div>
  </header>

  <!-- Main layout -->
  <div class="mainLayout">
    <!-- Sidebar -->
    <aside class="panel">
      <h2 id="panelTitle">Click a station</h2>
      <p class="muted" id="panelSubtitle">Hover or click a station to see details.</p>

      <!-- Basic info -->
      <div class="card">
        <div class="row"><span>River:</span> <strong id="river">—</strong></div>
        <div class="row"><span>Avg annual precip:</span> <strong id="climate">—</strong></div>
      </div>

      <!-- Seasonal stats -->
      <div class="card">
        <h3 id="trendTitle">Trend (—)</h3>
        <div class="row"><span>Dry season:</span> <strong id="dry">—</strong></div>
        <div class="row"><span>Wet season:</span> <strong id="wet">—</strong></div>
        <div class="row"><span>Annual:</span> <strong id="annual">—</strong></div>
      </div>

      <!-- Land cover donut -->
      <div class="card">
        <h3 class="cardTitle">Land cover</h3>
        <div class="smallNote">Percent of subbasin area</div>
        <div class="landcoverWrap">
          <canvas id="landcoverChart"></canvas>
        </div>
        <div id="landcoverFallback" class="smallNote" style="display:none;"></div>
      </div>

      <p class="muted" id="statusText"></p>
    </aside>

    <!-- Map + bottom chart -->
    <div class="mapContainer">
      <div id="map"></div>

      <div class="bottomChart" id="bottomChart">
        <div class="resizeHandle" id="resizeHandle" title="Drag to resize"></div>

        <div class="chartHeader">
          <h3 id="chartTitle">Daily Streamflow</h3>

          <div class="chartControls">
            <label>
              Start year:
              <select id="startYear"></select>
            </label>

            <label>
              End year:
              <select id="endYear"></select>
            </label>

            <button class="chartBtn" id="closeChartBtn" title="Close chart">✕</button>
          </div>
        </div>

        <canvas id="stationChart"></canvas>
        <p class="muted" id="chartNote">Click a station to load its chart.</p>
      </div>
    </div>
  </div>

  <button class="showChartBtn" id="showChartBtn" title="Show chart">Show chart</button>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Your JS -->
  <script src="app.js"></script>
</body>
</html>
